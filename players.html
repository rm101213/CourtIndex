<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Players | CourtIndex
    </title>


    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


<header class="site-header">

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo"
        >
            WNBA Archive
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="players.html">
                Players
            </a>

            <a href="#">
                Compare
            </a>

            <a href="#">
                Archive
            </a>

        </nav>

    </div>

</header>


<main class="players-page">


    <section class="page-intro">

        <div class="container">

            <p class="eyebrow">
                Player Archive
            </p>

            <h1>
                Explore Players
            </h1>

            <p>
                Search WNBA players across the
                2005–2025 archive.
            </p>

        </div>

    </section>


    <section class="player-search-section">

        <div class="container">

            <div class="search-wrapper">

                <input
                    id="player-search"
                    type="search"
                    placeholder="Search players..."
                    autocomplete="off"
                >

            </div>


            <p
                id="player-count"
                class="player-count"
            >
            </p>


            <div
                id="player-list"
                class="player-grid"
            >
            </div>

        </div>

    </section>


</main>


<script src="js/players.js"></script>


</body>
</html>
